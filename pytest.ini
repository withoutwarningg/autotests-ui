[pytest]
minversion = 7.0
pythonpath = .
testpaths = tests
addopts = -ra --strict-markers --alluredir=reports/allure-results
markers =
    smoke: минимальный набор, покрывающий основные happy-path сценарии
    regression: более широкий набор (сортировки, доп. сценарии корзины/чекаута)
    negative: ошибки, валидация форм и граничные случаи
